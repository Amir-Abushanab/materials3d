name: Release

# Changesets-driven publishing. On every push to main:
#   * pending changesets: opens/updates a "Version Packages" PR (bumps versions + changelogs)
#   * that PR merged: publishes the bumped @materials3d/* packages to npm, tags, GitHub Release
#
# Auth is OIDC / Trusted Publishing (`id-token: write` + NPM_CONFIG_PROVENANCE), so there is no
# stored token.
#
# Every action here is pinned to a commit SHA, not a major tag, and that matters more in this file
# than in ci.yml: this job can publish to npm unattended, because each package's trusted publisher
# allows `npm publish` directly rather than only `npm stage publish`. npm warns against that, and
# the warning is fair — the alternative is `npm stage publish` plus a human running
# `npm stage approve --otp`, which is deliberately not automatable, and this pipeline exists to
# release on a push. So the risk moves to whatever code the job runs, and a major tag is mutable:
# `changesets/action@v2` is a BRANCH, force-pushable at will, and the `actions/*` majors are tags
# that get re-pointed on every release. A SHA cannot be re-pointed. .github/dependabot.yml keeps
# them fresh.
#
# One-time prerequisites, all three of which have to be done or the publish 403s:
#   1. Publish the first version from a laptop (`npm login`, then `pnpm release`); npm cannot do a
#      package's FIRST publish over OIDC.
#   2. On each package's npm settings add a Trusted Publisher: GitHub Actions, this owner, this
#      repo, workflow filename `release.yml`, environment BLANK (no job here declares one).
#   3. On that same form tick "Allow `npm publish`" under Allowed actions. Without it the
#      connection can only STAGE, and this pipeline's direct publish comes back as
#      `403 ... OIDC permission denied for this action` — which reads like a missing publisher
#      but is not one. That checkbox is the concession described above.
# The preflight job skips publishing until the packages exist on npm, so runs before step 1 stay
# green rather than failing on a package that has never been published.
#
# changesets/action@v2, not @v1: v1 grepped the publish output for "New tag:" lines to learn what
# shipped, and the changesets v3 CLI doesn't always print them; a sibling project saw a package reach
# npm on 2026-08-24 from a green run that pushed no tags and created no GitHub releases. v2 hands
# the publish script a file path in CHANGESETS_OUTPUT and reads `{"type":"git-tag",...}` events
# from it (scripts/publish-if-needed.mjs writes one per tag), then creates the tags and releases
# through the GitHub API.
#
# That choice pins the CLI too: v2 of the action refuses to run against Changesets CLI v2 outright
# ("designed to work with Changesets CLI v3 ... use Changesets action v1 instead"), and it refuses
# before doing anything, so the run leaves no version branch and no PR to show for itself. The
# workspace therefore tracks @changesets/cli v3 and @changesets/changelog-github v1 (its matching
# major, both on @changesets/types v7). Keep the two majors moving together.

on:
  push:
    branches: [main]
    # Only when something publishable changes. A studio-only / docs / CI push has nothing to
    # publish, so skip the whole workflow rather than attempt a (crash-prone) no-op re-publish.
    paths:
      - "packages/**"
      - ".changeset/**"
  workflow_dispatch: {}

# One release run at a time, and never cancel one in progress: a run cancelled mid-publish can
# leave packages on npm without their tags or GitHub releases. cancel-in-progress cannot tell a
# versioning run from a publishing one, so it is not the answer to a run that starts after main
# moved on; scripts/version-pr-guard.sh is (see the "Check main has not moved on" step).
# GitHub keeps only the newest PENDING run per group and cancels the older one. That newer run is
# at a newer commit, so it covers the versioning; but if it is in version mode (it carries new
# changesets) it publishes nothing, and a cancelled pending publish waits for the next publish run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write # the Version Packages PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  preflight:
    name: Publish gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        run: |
          if npm view @materials3d/core version >/dev/null 2>&1; then
            echo "publish=pnpm release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@materials3d/* not on npm yet; managing Version PRs only. Publish 0.1.0 from a laptop, then enable Trusted Publishing."
          fi

  release:
    name: Version or publish
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      # Taken before anything else, so that "newer than this" in the guard step means "made by
      # this run": the previous run's branch push and PR update are minutes older at the least.
      - id: started
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Gate both the version PR and the publish on the packages being sound. ci.yml runs on these
      # same pushes but is a SEPARATE workflow with no dependency here, so without this a red suite
      # could still publish to npm, the one thing this pipeline does that can't be taken back.
      # Scoped to @materials3d/*: a studio-only lint or test failure must not block a package
      # release, but a package that does not typecheck must.
      - run: pnpm -r --filter "@materials3d/*" typecheck
      - run: pnpm -r --filter "@materials3d/*" test
      # Trusted publishing needs npm >= 11.5.1; Node 24 may ship an older npm. Pinned to the major
      # so a new npm cannot change what a release run does.
      - run: npm install -g npm@11
      # Versioning reads the commit this run checked out, but a run can start long after its push
      # (it waits for the run ahead of it in the concurrency group), and main may have moved
      # on by then. orb3d #16: the run for 71db24e versioned it after #15 had put 0.3.1 on main,
      # and opened a Version PR bumping nothing. If main has since changed under packages/ or
      # .changeset/, the release run for that push is queued behind this one and versions from it,
      # so this one skips the action. Never skips a publish (a checkout with no changesets).
      - name: Check main has not moved on
        id: fresh
        run: bash scripts/version-pr-guard.sh precheck
      - name: Version Packages PR / publish
        id: changesets
        if: steps.fresh.outputs.skip != 'true'
        # Soft-fail on purpose. This action manages BOTH the version PR and the publish, and it
        # reports PR-API problems as a bare `HttpError`: an Octokit RequestError whose message is
        # empty, so `Error.toString()` degrades to just the name. That tells you nothing and kills
        # the run. The guard step below decides the real outcome and prints the actual API error.
        continue-on-error: true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `pnpm run version`, NOT `pnpm version`: the latter is a pnpm BUILTIN that bumps
          # package.json and tags, which is not what the release flow wants; it has to be the
          # repo's own `version` script (`changeset version`).
          version-script: pnpm run version
          # Empty until the packages exist on npm (see preflight): PR-only, no publish attempt.
          publish-script: ${{ needs.preflight.outputs.publish }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # For the VERSION-SCRIPT, not for the action. v2 takes its own credential from the
          # github-token input, which already defaults to this workflow's token — but the script
          # it spawns runs `changeset version`, and @changesets/changelog-github resolves every
          # commit to a PR and author through the GitHub API to write the changelog. That reads
          # process.env.GITHUB_TOKEN and nothing else, and without it `changeset version` exits 1
          # with "Please create a GitHub personal access token", having applied nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Decide the run's real outcome, and self-heal the failure the action cannot report on.
      # Two flakes observed in the sibling repo, both leaving the version branch pushed but no PR:
      #   * create path: empty-body HttpError, nothing opened
      #   * update path: "State cannot be changed. The pull request cannot be reopened.", when the
      #     PR it listed as open gets merged mid-run (a race with a human merge)
      # `gh` prints the real status, so a genuine block (the account-level "Allow GitHub Actions to
      # create and approve pull requests" toggle, say) surfaces as a message, not "HttpError".
      #
      # Two things this must NOT do: pass a run whose `changeset version` crashed just because an
      # older PR happens to be open (that PR is stale, it lacks this run's changesets), and open a
      # PR for a branch whose bump main already has (a squash- or rebase-merged version PR leaves
      # its commit off main, so the branch stays "ahead" for good).
      #
      # scripts/version-pr-guard.sh ensure compares the version branch against main fetched fresh at
      # this point, not this run's checkout, and acts only on a `version` newer than main's
      # (dependency edits on a leftover branch are not a release, orb3d #12). An open Version PR
      # that bumps nothing main lacks is closed with a comment and its branch deleted: it was
      # versioned from a commit main has since released past, or main moved during the action.
      - name: Ensure Version Packages PR
        if: steps.fresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.changesets.outcome }}
          STARTED: ${{ steps.started.outputs.at }}
        run: bash scripts/version-pr-guard.sh ensure
